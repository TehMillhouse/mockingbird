<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockingbird · Choir pieces</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header>
  <form id="choice">
    <label>Piece <select id="piece"></select></label>
    <label>My part <select id="part"></select></label>
    <label id="verse-choice" hidden>Text <select id="verse"></select></label>
    <a href="./">Sight-singing trainer</a>
  </form>
  <div id="controls">
    <label>My part <input id="mine" type="range" min="0" max="100" value="50"><output for="mine"></output></label>
    <label>Other voices <input id="choir" type="range" min="0" max="100" value="40"><output for="choir"></output></label>
    <label>Voices <select id="voicing">
      <option value="all-sung">All sung</option>
      <option value="mine-sung">Mine sung, rest synth</option>
      <option value="mine-synth" selected>Mine synth, rest sung</option>
      <option value="all-synth">All synth</option>
    </select></label>
    <label>Piano <input id="piano" type="range" min="0" max="100" value="60"><output for="piano"></output></label>
    <label>Tempo <input id="tempo" type="range" min="50" max="150" step="5" value="100"><output for="tempo"></output></label>
    <label><input id="autoscroll" type="checkbox" checked> Autoscroll</label>
    <button id="play" type="button" disabled>Play</button>
  </div>
  <div id="devices"></div>
</header>
<p id="status">Loading…</p>
<main id="paper"></main>
<footer>
  <kbd>Space</kbd> play / pause · <kbd>R</kbd> restart · <kbd>M</kbd> microphone · <kbd>+</kbd> <kbd>-</kbd> tempo ·
  tap a bar to start there
</footer>
<script type="module" src="/src/piece.ts"></script>
</body>
</html>
