[project]
name = "mockingbird"
version = "0.1.0"
description = "Sight-singing trainer: melody-level generation backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7",
    "music21>=9.3",
    "numpy>=2.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "ms3>=2.5.2",
    "pandas<3",
]

[project.scripts]
mb = "mockingbird.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockingbird"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
